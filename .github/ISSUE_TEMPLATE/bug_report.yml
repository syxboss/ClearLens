name: Bug Report
description: Report a crash, UI glitch, or unexpected scan result
labels: ["bug"]
body:
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ClearLens / clens Version
      placeholder: "v0.1.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug and steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: CLI Output / Audit Log (redact personal usernames if needed)
      render: shell
