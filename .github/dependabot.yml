version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/apps/desktop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      desktop-frontend:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
