schema_version = 1
category = "browsers"
app_name = "Web Browsers"
app_name_zh = "主流浏览器缓存"
process_names_win = ["chrome.exe", "msedge.exe", "brave.exe", "firefox.exe", "arc.exe"]
process_names_mac = ["Google Chrome", "Microsoft Edge", "Brave Browser", "Firefox", "Arc", "Safari"]

[[rules]]
id = "browsers.chrome.cache"
title = "Google Chrome Web & GPU Cache"
title_zh = "Chrome 网页与 GPU 缓存"
kind = "glob"
risk = "safe"
default_checked = true
delete_mode = "permanent"
min_age_days = 0
impact_note = "Preserves cookies, passwords, bookmarks, and login sessions; clears only cached web assets."
impact_note_zh = "严格保留 Cookie、登录态、书签与历史记录，仅清理网页静态资源与 GPU 着色缓存。"

[rules.paths]
macos = [
  "~/Library/Caches/Google/Chrome/*/Cache/**",
  "~/Library/Caches/Google/Chrome/*/Code Cache/**",
  "~/Library/Application Support/Google/Chrome/*/GPUCache/**",
  "~/Library/Application Support/Google/Chrome/*/DawnCache/**",
  "~/Library/Application Support/Google/Chrome/*/Service Worker/CacheStorage/**",
]
windows = [
  "%LOCALAPPDATA%/Google/Chrome/User Data/*/Cache/**",
  "%LOCALAPPDATA%/Google/Chrome/User Data/*/Code Cache/**",
  "%LOCALAPPDATA%/Google/Chrome/User Data/*/GPUCache/**",
  "%LOCALAPPDATA%/Google/Chrome/User Data/*/DawnCache/**",
  "%LOCALAPPDATA%/Google/Chrome/User Data/*/Service Worker/CacheStorage/**",
]
linux = [
  "~/.cache/google-chrome/*/Cache/**",
  "~/.cache/google-chrome/*/Code Cache/**",
]

[rules.exclude]
patterns = [
  "**/Cookies*",
  "**/Login Data*",
  "**/Web Data*",
  "**/Bookmarks*",
  "**/History*",
  "**/Local Storage/**",
  "**/IndexedDB/**",
]

[[rules]]
id = "browsers.edge.cache"
title = "Microsoft Edge Web & GPU Cache"
title_zh = "Microsoft Edge 网页与 GPU 缓存"
kind = "glob"
risk = "safe"
default_checked = true
delete_mode = "permanent"
