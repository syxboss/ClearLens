[[rules]]
id = "browsers.arc.cache"
title = "Arc Browser Cache"
title_zh = "Arc 浏览器缓存"
kind = "glob"
risk = "safe"
default_checked = true
delete_mode = "permanent"
impact_note = "Clears Arc web cache while preserving Spaces, tabs, and logins."
impact_note_zh = "清理 Arc 网页缓存，保留所有 Spaces、标签页与登录态。"

[rules.paths]
macos = [
  "~/Library/Caches/Arc/*/Cache/**",
  "~/Library/Caches/Arc/*/Code Cache/**",
  "~/Library/Application Support/Arc/User Data/*/GPUCache/**",
]
windows = [
  "%LOCALAPPDATA%/Packages/TheBrowserCompany.Arc*/LocalCache/Local/Arc/User Data/*/Cache/**",
  "%LOCALAPPDATA%/Packages/TheBrowserCompany.Arc*/LocalCache/Local/Arc/User Data/*/GPUCache/**",
]

[rules.exclude]
patterns = ["**/Cookies*", "**/Login Data*", "**/History*"]

