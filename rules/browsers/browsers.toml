[[rules]]
id = "browsers.firefox.cache"
title = "Mozilla Firefox Profile Cache"
title_zh = "Firefox 网页缓存"
kind = "glob"
risk = "safe"
default_checked = true
delete_mode = "permanent"
impact_note = "Clears Firefox cache2 entries; cookies and logins are untouched."
impact_note_zh = "仅清理 Firefox cache2 目录，保留登录信息与扩展数据。"

[rules.paths]
macos = [
  "~/Library/Caches/Firefox/Profiles/*/cache2/**",
]
windows = [
  "%LOCALAPPDATA%/Mozilla/Firefox/Profiles/*/cache2/**",
]
linux = [
  "~/.cache/mozilla/firefox/*/cache2/**",
]

[[rules]]
id = "browsers.safari.cache"
title = "Apple Safari Cache"
title_zh = "Safari 浏览器缓存"
kind = "glob"
risk = "safe"
default_checked = true
delete_mode = "permanent"
impact_note = "Clears Safari WebKit network & media caches."
impact_note_zh = "清理 Safari WebKit 网页缓存与媒体预览缓存。"

[rules.paths]
macos = [
  "~/Library/Caches/com.apple.Safari/WebKitCache/**",
  "~/Library/Caches/com.apple.Safari/fsCachedData/**",
]
