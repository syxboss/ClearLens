[workspace]
resolver = "2"
members = [
    "crates/clearlens-core",
    "crates/clearlens-cli",
    "apps/desktop/src-tauri",
]
default-members = [
    "crates/clearlens-core",
    "crates/clearlens-cli",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/syxboss/ClearLens"
description = "Cross-platform transparent disk cleaner, developer/AI cache optimizer, and Space Lens visualizer"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
globset = "=0.4.22"
rayon = "1.10"
rustc-hash = "2.1"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7.0"
trash = "=5.4.0"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
blake3 = "=1.8.7"
mimalloc = { version = "=0.1.52", default-features = false }
clap = { version = "4.5", features = ["derive"] }
comfy-table = "8.0"
indicatif = "0.18"
libc = "0.2"
tempfile = "3.14"
filetime = "0.2"
